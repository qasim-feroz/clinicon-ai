kind = "web"
previewPath = "/"
title = "Clinicon AI Landing Page"
version = "1.0.0"
id = "artifacts/clinicon-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22378

[services.development]
run = "pnpm --filter @workspace/clinicon-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinicon-landing", "run", "build" ]
publicDir = "artifacts/clinicon-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22378"
BASE_PATH = "/"
